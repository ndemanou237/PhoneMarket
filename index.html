<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhoneMarket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header>
        <h1>PhoneMarket</h1>
        <span><i class="fa-solid fa-bars"></i></span>
        <nav>
            <a href="#">Accueil</a>
            <a href="#">S'abonner</a>
            <a href="#">Phone</a>
        </nav>
    </header>
    <section class="home">
        <h1>Trouver le telephone de vos rêve</h1>
        
        <div class="search">
            <input type="text" placeholder="Marque">
            <select name="" id="" >
                <option value="Prix max">Prix max</option>
                <option value="">1M fcfa</option>
                <option value="">1,2M fcfa</option>
                <option value="">2M fcfa</option>
            </select>
            <button class="btn">Rechercher</button>
        </div>
    </section>
    <section class="font">
        <div class="first">
            <span><i class="fa-solid fa-magnifying-glass"></i></span>
            <h2>Recherche facile</h2>
            <p class="modify">Trouver rapidement le telephone qu'il vous faut.</p>
        </div>
        <div class="second">
            <span><i class="fa-solid fa-tag"></i></span>
            <h2>Meilleurs prix</h2>
            <p class="modify">Comparez et trouvez les meilleurs offres.</p>
        </div>
        <div class="third">
            <span><i class="fa-solid fa-shield-halved"></i></span>
            <h2>Fiable & sécurisé</h2>
            <p class="modify">Vos données sont protégées.</p>
        </div>
    </section>
    <footer>
        <p>&copy;2026 By Shadow</p>
    </footer>
</body>
</html>
